<!DOCTYPE html><html lang=zh-HK><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>ZZTEST · Idea Lab</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b1f27;--mut:#6b7280;--line:#e6e8ec;--ac:#4f46e5;--gold:#c79a2b;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang HK",sans-serif}
.wrap{max-width:430px;margin:0 auto;padding:13px 13px 130px}
h1{font-size:19px;font-weight:800;margin:0;line-height:1.25}h1 .dept{color:var(--ac)}
.bdp{font-size:12px;font-weight:700;margin-top:3px;display:flex;gap:11px;flex-wrap:wrap}
.bdp .bb{color:#2563eb}.bdp .dd{color:#dc2626}.bdp .pp{color:#7c3aed}
.phaseind{display:flex;gap:3px;overflow-x:auto;padding:11px 0 2px;margin:6px 0 0;scrollbar-width:none}
.phaseind::-webkit-scrollbar{display:none}
.pi{flex:1 1 0;min-width:58px;text-align:center}
.pi i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:99px;background:#e5e7eb;color:#9aa0aa;font-size:11px;font-weight:800;font-style:normal;margin:0 auto 3px}
.pi b{display:block;font-size:10px;font-weight:700;color:#9aa0aa;line-height:1.2}
.pi.on i{background:var(--ac);color:#fff}.pi.on b{color:var(--ink)}
.pi.kv i{background:#fff;border:1.5px dashed #cbd5e1;color:#94a3b8}
.indhint{font-size:10.5px;color:#aab0ba;margin:3px 2px 0}
.banner{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;color:#92660c;margin:10px 0}
.h2{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--mut);text-transform:uppercase;margin:15px 2px 7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;box-shadow:0 1px 2px rgba(20,24,40,.05),0 5px 16px rgba(20,24,40,.06);margin-bottom:8px}
.row{display:flex;align-items:center;gap:9px}.rank{font-size:11px;font-weight:800;color:var(--mut);width:18px}
.src{font-size:11px;color:var(--mut);font-weight:700;background:#f1f5f9;border-radius:6px;padding:1px 6px}
.score{font-size:12px;font-weight:800;color:var(--gold);margin-left:auto}.nm{font-weight:800;font-size:13.5px}
.kv{font-size:12.5px;margin:3px 0;color:#374151}.kv b{color:var(--mut);font-weight:700;font-size:11px;margin-right:5px}
.ck{width:22px;height:22px;border:2px solid var(--ac);border-radius:6px;display:inline-grid;place-items:center;font-size:13px;color:#fff;cursor:pointer;flex:0 0 auto;position:relative}
.ck::before{content:"";position:absolute;inset:-11px}.ck.on{background:var(--ac)}
.divider{display:flex;align-items:center;gap:8px;margin:12px 2px;color:#aab0ba;font-size:11px;font-weight:700}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.cnt-warn{color:var(--red)!important}
.lookback{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:11px;padding:10px 12px;font-size:12px;color:#475569}
.btn{background:var(--ac);color:#fff;border:none;border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:800;cursor:pointer}
.btn.mini{padding:4px 9px;font-size:11px;margin-left:8px;text-decoration:none;display:inline-block}
.submit{position:fixed;bottom:14px;right:calc(50% - 215px + 13px);z-index:20}@media(max-width:456px){.submit{right:14px}}
.submit .btn{box-shadow:0 6px 20px rgba(79,70,229,.4);padding:11px 18px;font-size:13.5px}
.foot{font-size:11px;color:#9aa0aa;text-align:center;margin-top:22px}
</style></head><body><div class=wrap>
<header><h1><span class=dept>ZZTEST</span> · ZZTEST</h1><div class=bdp></div></header>
<div class=phaseind><div class='pi  '><i>1</i><b>概念·選六強</b></div><div class='pi on '><i>2</i><b>六強·12格</b></div><div class='pi  '><i>3</i><b>BD·選三甲</b></div><div class='pi  '><i>4</i><b>FINAL 2</b></div><div class='pi  kv'><i>K</i><b>KV MOD</b></div></div>
<div class=indhint>↑ 流程指示（唯讀，系統行到邊就 highlight 邊）</div>
<div class='banner'>Phase 2 —— generator 逐步落地中(funnel_state 驅動)。</div>
<div class=h2>👀 睇返區</div><div class='lookback'>每輪冇進級嘅 idea 會自動歸檔喺度,永遠睇得返,撳「⤴️升級」補生返上嚟。</div>
<div class=foot>Idea Lab · 更新 06-04 22:18 · ⚠️ AI 初步創意,出客前需 Raymond review</div>
</div>
<script>
var DL=new Date("2026-06-09T11:00:00+08:00").getTime();
function cd(){var e=document.getElementById('cd');if(!e)return;var x=DL-Date.now();if(x<0){e.textContent='已截標';return;}
var s=Math.floor(x/1000),d=Math.floor(s/86400);s-=d*86400;var h=Math.floor(s/3600);s-=h*3600;var m=Math.floor(s/60);s-=m*60;
e.textContent=(d>0?d+'日 ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
cd();setInterval(cd,1000);
function tk(el){el.classList.toggle('on');el.textContent=el.classList.contains('on')?'✓':'';upd();}
function upd(){var n=document.querySelectorAll('.ck.on').length;var c=document.getElementById('cnt');if(c){c.textContent=n;c.parentElement.classList.toggle('cnt-warn',n>6);}}
document.querySelectorAll('.card[data-cid]').forEach(function(c){var k=c.querySelector('.ck');if(k)c.addEventListener('click',function(e){if(e.target.closest('.ck'))return;tk(k);});});
function submitRound(){
  var cids=[].map.call(document.querySelectorAll('.card[data-cid] .ck.on'),function(k){return k.closest('[data-cid]').dataset.cid;});
  if(!cids.length){alert('未揀');return;}
  location.href="https://script.google.com/macros/s/AKfycbzLZ7pBlJ9hnSlJZs3lKl5rLGsRGx3xdoe8_vcZvfDEoJulMAybBQhGxVPlNL9d9p5p/exec?action=submit_round&dept=ZZTEST&round=r2&cids="+cids.join(',');
}
</script></body></html>
