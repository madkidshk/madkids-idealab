name: Encrypt & Deploy Pages

# 各 pipeline 照 push plaintext 去 main；呢個 Action 喺每次 push 後用 staticrypt
# AES 加密全站 HTML（一個密碼 + 30 日 remember）→ 出去 GitHub Pages。
# 密碼 = repo secret STATICRYPT_PASSWORD。salt 固定（公開冇問題）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Encrypt all HTML with staticrypt
        env:
          SC_PWD: ${{ secrets.STATICRYPT_PASSWORD }}
          SC_PWD_TOOL: ${{ secrets.STATICRYPT_PASSWORD_TOOL }}
        run: |
          set -e
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/
          count=0
          # 全站同一密碼+salt；工具頁（supplier_video.html）完全唔加密（2026-06-12 Raymond）
          while IFS= read -r -d '' f; do
            case "$f" in dist/s/*) skip_enc=1;; *) skip_enc=0;; esac
            if [ "$(basename "$f")" != "supplier_video.html" ] && [ "$skip_enc" != "1" ]; then
              npx --yes staticrypt "$f" -d "$(dirname "$f")" \
                -p "$SC_PWD" -s 'da37644ab187b199430a20aa832bc9fa' \
                --remember 30 --short -c false
              # Raymond 06-14：30 日 remember 要永遠生效。--short 收埋咗 remember 剔格又冇預設剔，
              # 令 login JS 嘅 isRememberChecked=false 永遠唔記 → 強制 checkbox 預設 checked。
              sed -i 's#id="staticrypt-remember" type="checkbox" name="remember"#id="staticrypt-remember" type="checkbox" name="remember" checked#' "$f"
            fi
            # noindex：唔好被 Google index（加密頁/工具頁都要）
            sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' "$f"
            count=$((count+1))
          done < <(find dist -name '*.html' -print0)
          echo "encrypted $count html file(s)"
          # 安全網：除咗工具頁（特准 plaintext），每個 html 都要有 staticrypt marker，否則 fail
          missing=0
          while IFS= read -r -d '' f; do
            [ "$(basename "$f")" = "supplier_video.html" ] && continue
            case "$f" in dist/s/*) continue;; esac
            grep -q 'staticrypt' "$f" || { echo "::error::not encrypted: $f"; missing=$((missing+1)); }
          done < <(find dist -name '*.html' -print0)
          if [ "$missing" -gt 0 ]; then echo "::error::$missing page(s) not encrypted"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
