name: Deploy Pages

# Raymond 2026-06-15：加密已 DISABLE（唔好再浪費時間加密全站）。
# 呢個 Action 只係 copy 全站 + 加 noindex → 出 GitHub Pages（plaintext，公開）。
# ⚠️ dashboard 內容（標書／創意）而家公開，靠 noindex + 隱蔽 URL，冇密碼。
#    要復原加密 = git revert 呢個 commit（之前 staticrypt 版喺 git history）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site — copy + noindex only（加密已 disable，唔再浪費時間）
        run: |
          set -e
          mkdir -p dist
          # ⛔ 排除個別 frame_*.png(3.3GB,dashboard 只用 board_sheet.png 合成圖) + grounding .source.pdf(NLM 餵料,唔上 live)
          #    解 Pages artifact 爆 6.6GB upload 卡死(Raymond 一直見舊版根因,2026-06-16)。board_sheet.png 照上。
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' \
                --exclude='frame_*.png' --exclude='*.source.pdf' ./ dist/
          echo "dist size:"; du -sh dist
          # 唔再加密;只加 noindex(唔好畀 Google index;dashboard 仍靠隱蔽 URL)
          count=0
          while IFS= read -r -d '' f; do
            grep -q 'name="robots"' "$f" || sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' "$f"
            count=$((count+1))
          done < <(find dist -name '*.html' -print0)
          echo "prepared $count html file(s) — plaintext + noindex"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
